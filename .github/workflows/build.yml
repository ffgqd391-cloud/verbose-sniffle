name: Build OB25 Native Lib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r21e
          local-cache: true

      - name: Extract mod source
        run: |
          unzip -o NewMod-Layout-Style.zip -d modsrc
          echo "--- makefiles found ---"
          find modsrc -name "Android.mk" -o -name "Application.mk"

      - name: Locate JNI project root
        id: find_jni
        run: |
          JNI_DIR=$(dirname "$(find modsrc -name 'Android.mk' | head -n 1)")
          echo "jni_dir=$JNI_DIR" >> $GITHUB_OUTPUT

      - name: Build with ndk-build
        run: |
          ${{ steps.setup_ndk.outputs.ndk-path }}/ndk-build \
            NDK_PROJECT_PATH=${{ steps.find_jni.outputs.jni_dir }} \
            APP_BUILD_SCRIPT=${{ steps.find_jni.outputs.jni_dir }}/Android.mk \
            NDK_APPLICATION_MK=${{ steps.find_jni.outputs.jni_dir }}/Application.mk \
            APP_PLATFORM=android-21 \
            APP_ABI="arm64-v8a armeabi-v7a"

      - name: Upload .so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ob25-native-libs
          path: ${{ steps.find_jni.outputs.jni_dir }}/libs/
